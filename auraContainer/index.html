<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>External App</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #log { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    #outgoing { margin-top: 20px; }
  </style>
</head>
<body>
  <h2>External App</h2>

  <p><strong>Messages from Salesforce:</strong></p>
  <div id="log">No messages yet</div>

  <div id="outgoing">
    <label for="msgInput">Send message to Salesforce:</label><br/>
    <input type="text" id="msgInput" placeholder="Type your message..." />
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const logDiv = document.getElementById("log");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    // Listen for messages from Aura
    Sfdc.container.onMessage(function(msg) {
        logDiv.innerText = "From Salesforce: " + (msg.message || JSON.stringify(msg));

        // Optional auto-reply back to Aura
        Sfdc.container.publishMessage({
            message: { action: "autoReply", message: "I got your message: " + (msg.message || "") }
        });
    });

    // Send typed message back to Aura
    sendBtn.addEventListener("click", () => {
        const text = msgInput.value;
        if (text.trim() !== "") {
            Sfdc.container.publishMessage({
                message: { action: "fromExternalApp", message: text }
            });
            msgInput.value = ""; // clear input
        }
    });
  </script>
</body>
</html>
